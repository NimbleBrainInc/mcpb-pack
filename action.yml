name: "MCPB Pack"
description: "Package MCP servers into .mcpb bundles and upload them to GitHub releases"
author: "NimbleBrain Inc"

branding:
  icon: "package"
  color: "blue"

inputs:
  directory:
    description: "Directory containing the MCP server and manifest.json"
    required: false
    default: "."
  bundle-path:
    description: "Path to existing .mcpb bundle (relative to directory). When provided with build=false, skips building and uses this bundle."
    required: false
  output:
    description: "Output filename for the .mcpb bundle (supports {name}, {version} placeholders)"
    required: false
  python-version:
    description: "Python version for vendoring deps (if Python server)"
    required: false
    default: "3.13"
  build:
    description: "Whether to build the .mcpb bundle"
    required: false
    default: "true"
  upload:
    description: "Whether to upload the bundle to the GitHub release (requires release event)"
    required: false
    default: "true"
  # The inputs below served the mpak registry, which is retired. They stay
  # accepted so workflows pinned to @v3 keep running unchanged; they do nothing.
  announce:
    description: "Ignored. The mpak registry is retired; bundles are not announced anywhere."
    required: false
    deprecationMessage: "mcpb-pack no longer announces bundles (the mpak registry is retired). Remove this input."
  announce-url:
    description: "Ignored. The mpak registry is retired."
    required: false
    deprecationMessage: "mcpb-pack no longer announces bundles (the mpak registry is retired). Remove this input."
  announce-required:
    description: "Ignored. The mpak registry is retired."
    required: false
    deprecationMessage: "mcpb-pack no longer announces bundles (the mpak registry is retired). Remove this input."
  platform-os:
    description: "Ignored. It labelled the artifact for the mpak registry, which is retired."
    required: false
    deprecationMessage: "platform-os only labelled the artifact for the retired mpak registry. Remove this input; name the platform in `output` instead."
  platform-arch:
    description: "Ignored. It labelled the artifact for the mpak registry, which is retired."
    required: false
    deprecationMessage: "platform-arch only labelled the artifact for the retired mpak registry. Remove this input; name the platform in `output` instead."

outputs:
  bundle-path:
    description: "Path to the .mcpb file"
    value: ${{ steps.pack.outputs.path || steps.existing.outputs.path }}
  bundle-size:
    description: "Size of the bundle in bytes"
    value: ${{ steps.pack.outputs.size || steps.existing.outputs.size }}
  bundle-sha256:
    description: "SHA256 hash of the bundle for integrity verification"
    value: ${{ steps.pack.outputs.sha256 || steps.existing.outputs.sha256 }}

runs:
  using: "composite"
  steps:
    # Validate first — manifest is mandatory and the rest of the pipeline
    # reads from it. Failing here saves a 30s+ Python `uv pip install`
    # vendor step on a broken manifest.
    - name: Validate manifest.json
      id: manifest
      shell: bash
      run: |
        cd "${{ inputs.directory }}"

        if [ ! -f "manifest.json" ]; then
          echo "::error::manifest.json not found in ${{ inputs.directory }}"
          exit 1
        fi

        # Valid JSON?
        if ! jq empty manifest.json 2>/dev/null; then
          echo "::error::manifest.json is not valid JSON"
          exit 1
        fi

        # Required mcpb v0.4 fields. v0.3 is also accepted (the required
        # set is identical; v0.4 only added the "uv" server.type and the
        # `icons[]` array).
        for field in manifest_version name version description server; do
          VALUE=$(jq -r ".${field} // empty" manifest.json)
          if [ -z "$VALUE" ]; then
            echo "::error::manifest.json missing required field: ${field}"
            exit 1
          fi
        done

        echo "manifest.json validated"

    - name: Setup Node.js
      if: inputs.build == 'true'
      uses: actions/setup-node@v6
      with:
        node-version: "22"

    - name: Setup Python
      if: inputs.build == 'true'
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      if: inputs.build == 'true'
      # Pinned to a specific tag because setup-uv doesn't publish a floating
      # `v8` major tag (verified 2026-05-06). Bump deliberately.
      uses: astral-sh/setup-uv@v8.1.0

    - name: Install mcpb CLI
      if: inputs.build == 'true'
      shell: bash
      run: npm install -g @anthropic-ai/mcpb

    - name: Vendor dependencies
      if: inputs.build == 'true'
      shell: bash
      run: |
        cd "${{ inputs.directory }}"

        # Detect runtime from manifest
        RUNTIME=$(jq -r '.server.type // .server.runtime // "unknown"' manifest.json)
        echo "Detected runtime: $RUNTIME"

        if [ "$RUNTIME" = "python" ]; then
          echo "Vendoring Python dependencies..."
          rm -rf deps/
          uv pip install --target ./deps --only-binary :all: . 2>/dev/null || \
          uv pip install --target ./deps .

          # Show what was installed (use || true to avoid SIGPIPE errors)
          echo "Vendored packages:"
          ls deps/ | head -20 || true
          du -sh deps/
        elif [ "$RUNTIME" = "node" ]; then
          echo "Vendoring Node.js dependencies..."
          rm -rf node_modules/
          npm install --omit=dev --prefix .

          echo "Vendored packages:"
          du -sh node_modules/
        else
          echo "Unknown runtime: $RUNTIME, skipping dependency vendoring"
        fi

    - name: Pack bundle
      id: pack
      if: inputs.build == 'true'
      shell: bash
      run: |
        cd "${{ inputs.directory }}"

        # Read manifest for placeholders
        NAME=$(jq -r '.name // "extension"' manifest.json | sed 's/@//g' | sed 's/\//-/g')
        VERSION=$(jq -r '.version // "0.0.0"' manifest.json)

        if [ -n "${{ inputs.output }}" ]; then
          OUTPUT="${{ inputs.output }}"
          # Replace placeholders
          OUTPUT="${OUTPUT//\{name\}/$NAME}"
          OUTPUT="${OUTPUT//\{version\}/$VERSION}"
        else
          OUTPUT="${NAME}-${VERSION}.mcpb"
        fi

        mcpb pack . "$OUTPUT"

        SIZE=$(stat -f%z "$OUTPUT" 2>/dev/null || stat -c%s "$OUTPUT")
        SHA256=$(shasum -a 256 "$OUTPUT" 2>/dev/null || sha256sum "$OUTPUT" | cut -d' ' -f1)
        SHA256=$(echo "$SHA256" | cut -d' ' -f1)

        echo "path=$OUTPUT" >> $GITHUB_OUTPUT
        echo "size=$SIZE" >> $GITHUB_OUTPUT
        echo "sha256=$SHA256" >> $GITHUB_OUTPUT
        echo "Bundle: $OUTPUT ($(du -h "$OUTPUT" | cut -f1))"
        echo "SHA256: $SHA256"

    - name: Use existing bundle
      id: existing
      if: inputs.build == 'false' && inputs.bundle-path != ''
      shell: bash
      run: |
        cd "${{ inputs.directory }}"
        BUNDLE="${{ inputs.bundle-path }}"

        if [ ! -f "$BUNDLE" ]; then
          echo "::error::Bundle not found: $BUNDLE"
          exit 1
        fi

        SIZE=$(stat -f%z "$BUNDLE" 2>/dev/null || stat -c%s "$BUNDLE")
        SHA256=$(shasum -a 256 "$BUNDLE" 2>/dev/null || sha256sum "$BUNDLE" | cut -d' ' -f1)
        SHA256=$(echo "$SHA256" | cut -d' ' -f1)

        echo "path=$BUNDLE" >> $GITHUB_OUTPUT
        echo "size=$SIZE" >> $GITHUB_OUTPUT
        echo "sha256=$SHA256" >> $GITHUB_OUTPUT
        echo "Using existing bundle: $BUNDLE ($(du -h "$BUNDLE" | cut -f1))"
        echo "SHA256: $SHA256"

    - name: Upload to release
      id: upload
      if: inputs.upload == 'true' && github.event_name == 'release'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        cd "${{ inputs.directory }}"
        BUNDLE_PATH="${{ steps.pack.outputs.path || steps.existing.outputs.path }}"
        TAG="${{ github.event.release.tag_name }}"

        echo "Uploading $BUNDLE_PATH to release $TAG"
        gh release upload "$TAG" "$BUNDLE_PATH" --clobber

        echo "uploaded=true" >> $GITHUB_OUTPUT
